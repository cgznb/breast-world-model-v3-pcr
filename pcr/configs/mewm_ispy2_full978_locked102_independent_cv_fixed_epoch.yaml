  proj_dim: 32
  sig_dim: 16
  n_layers: 1
  n_heads: 4
  use_prior: true
  epochs: 33
  patience: 20
  min_delta: 0.001
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.0007
  dropout: 0.25
  embedding_dropout: 0.1
